services:
  backend:
    build: backend
    env_file:
      - .env
    depends_on:
      - postgres
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
  frontend:
    build: 
      context: frontend
      args:
        MESSAGE: SALUT
    cap_drop:
      - ALL
    ports:
      - 80:80
    env_file:
      - .env      
  nginx:
    build: nginx
    ports:
      - 7000:7000
    depends_on:
      - backend

  postgres:
    image: postgres    
    volumes:
      - ./dataset:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3